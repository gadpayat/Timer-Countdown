<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Project Completion Countdown for KKB-CDD</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

/* Top-center container */
.container{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:9999;
    padding:10px;
}

h1{
    margin:0 0 10px 0;
    font-size:1.5rem;
    text-shadow:0 0 10px rgba(255,255,255,0.4);
}

#countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:nowrap;
}

.time-box{
    background:rgba(34,34,34,0.9);
    padding:12px;
    border-radius:10px;
    min-width:90px;
    box-shadow:0 0 10px rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.1);
}

.number{
    font-size:2rem;
    font-weight:bold;
    line-height:1;
}

.label{
    font-size:0.8rem;
    margin-top:5px;
    color:#ccc;
    text-transform:uppercase;
}

/* Button below timer */
.button-container{
    margin-top:15px;
}

.nav-btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:12px 24px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 10px red;
    transition:all 0.3s ease;
}

.nav-btn:hover{
    background:#cc0000;
    transform:scale(1.05);
    box-shadow:0 0 20px red;
}
</style>
</head>

<body>

<div class="container">

    <h1>Sub-Project Completion Countdown for KKB-CDD</h1>

    <div id="countdown">

        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <!-- Button directly below countdown -->
    <div class="button-container">
        <button class="nav-btn"
            onclick="window.location.href='https://gadpayat.github.io/Status-Countdown/';">
            👉 Click HERE to view the Individual SP Countdown
        </button>
    </div>

</div>

<script>
const targetDate = new Date("October 31, 2026 00:00:00").getTime();

function updateCountdown() {

    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("countdown").innerHTML =
            "<h2>🎉 The countdown has ended!</h2>";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
    );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
